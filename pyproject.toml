[project]
name = "cairn"
version = "0.0.1"
description = "Turn verified proofs into readable ones: graph analysis of Lean blueprints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.9.1",
]

[project.scripts]
cairn = "cairn.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/cairn"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 120
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
