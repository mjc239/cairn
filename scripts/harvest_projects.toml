# Blueprint projects for the harvester (scripts/harvest.py), in harvest order.
# Each entry: name (directory under results/harvest/), repo (GitHub owner/name), and optionally
#   commit    pin a commit (default: the default branch's HEAD at harvest time, recorded in triage.json)
#   group_by  file | chapter | section (default: chosen from the blueprint's structure)
#   entry     blueprint entry file under blueprint/src (default: content.tex, then chapter/main.tex)
#   libs      Lean root modules to build and extract (default: the lakefile's lean_libs)
#   build_timeout  minutes (default 45)
# Ordered by size (lines of project Lean code, measured 2026-09-24), largest three last.
# Sources: the leanblueprint README's project list (github.com/PatrickMassot/leanblueprint).

